name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: [self-hosted, homelab]
    container:
      image: golang:1.25

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        shell: bash
        run: go vet ./...

      - name: Test
        shell: bash
        run: go test -race ./...

      - name: Build
        shell: bash
        run: go build -o prov ./cmd/prov
